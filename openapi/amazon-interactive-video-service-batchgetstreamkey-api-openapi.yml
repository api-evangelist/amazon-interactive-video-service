security:
- hmac: []
tags:
- name: BatchGetStreamKey
paths:
  /BatchGetStreamKey:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: BatchGetStreamKey
      description: Performs GetStreamKey on multiple ARNs simultaneously.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetStreamKeyResponse'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - arns
              properties:
                arns:
                  description: Array of ARNs, one per stream key.
                  type: array
                  items:
                    $ref: '#/components/schemas/StreamKeyArn'
                  minItems: 1
                  maxItems: 50
      summary: Amazon Interactive Video Service Batch Get Stream Key
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - BatchGetStreamKey
components:
  schemas:
    errorMessage:
      type: string
    errorCode:
      type: string
    StreamKey:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/StreamKeyArn'
          - description: Stream-key ARN.
        channelArn:
          allOf:
          - $ref: '#/components/schemas/ChannelArn'
          - description: Channel ARN for the stream.
        tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: Tags attached to the resource. Array of 1-50 maps, each of the form <code>string:string (key:value)</code>. See <a href="https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html">Tagging Amazon Web Services Resources</a> for more information, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no service-specific constraints beyond what is documented there.
        value:
          allOf:
          - $ref: '#/components/schemas/StreamKeyValue'
          - description: Stream-key value.
      description: Object specifying a stream key.
    StreamKeyValue:
      type: string
      format: password
    StreamKeys:
      type: array
      items:
        $ref: '#/components/schemas/StreamKey'
    ChannelArn:
      type: string
      pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:channel/[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    BatchGetStreamKeyResponse:
      type: object
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/BatchErrors'
          - description: <p/>
        streamKeys:
          allOf:
          - $ref: '#/components/schemas/StreamKeys'
          - description: <p/>
    StreamKeyArn:
      type: string
      pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:stream-key/[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    ResourceArn:
      type: string
      pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:[a-z-]/[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    BatchError:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: Channel ARN.
        code:
          allOf:
          - $ref: '#/components/schemas/errorCode'
          - description: Error code.
        message:
          allOf:
          - $ref: '#/components/schemas/errorMessage'
          - description: Error message, determined by the application.
      description: Error related to a specific channel, specified by its ARN.
    BatchErrors:
      type: array
      items:
        $ref: '#/components/schemas/BatchError'
    Tags:
      type: object
      minProperties: 0
      maxProperties: 50
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/ivs/
x-hasEquivalentPaths: true
