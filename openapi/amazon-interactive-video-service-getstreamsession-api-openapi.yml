  description: The Amazon IVS endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: GetStreamSession
paths:
  /GetStreamSession:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetStreamSession
      description: Gets metadata on a specified stream.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStreamSessionResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - channelArn
              properties:
                channelArn:
                  description: ARN of the channel resource
                  type: string
                  pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:channel/[a-zA-Z0-9-]+$
                  minLength: 1
                  maxLength: 128
                streamId:
                  description: Unique identifier for a live or previously live stream in the specified channel. If no <code>streamId</code> is provided, this returns the most recent stream session for the channel, if it exists.
                  type: string
                  pattern: ^st-[a-zA-Z0-9]+$
                  minLength: 26
                  maxLength: 26
      summary: Amazon Interactive Video Service Get Stream Session
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - GetStreamSession
components:
  schemas:
    PlaybackURL:
      type: string
    RecordingMode:
      type: string
      enum:
      - DISABLED
      - INTERVAL
    RecordingConfigurationArn:
      type: string
      pattern: ^arn:aws:ivs:[a-z0-9-]+:[0-9]+:recording-configuration/[a-zA-Z0-9-]+$
      minLength: 0
      maxLength: 128
    S3DestinationConfiguration:
      type: object
      required:
      - bucketName
      properties:
        bucketName:
          allOf:
          - $ref: '#/components/schemas/S3DestinationBucketName'
          - description: Location (S3 bucket name) where recorded videos will be stored.
      description: A complex type that describes an S3 location where recorded videos will be stored.
    VideoConfiguration:
      type: object
      properties:
        avcLevel:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Indicates the degree of required decoder performance for a profile. Normally this is set automatically by the encoder. For details, see the H.264 specification.
        avcProfile:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Indicates to the decoder the requirements for decoding the stream. For definitions of the valid values, see the H.264 specification.
        codec:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Codec used for the video encoding.
        encoder:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Software or hardware used to encode the video.
        targetBitrate:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The expected ingest bitrate (bits per second). This is configured in the encoder.
        targetFramerate:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The expected ingest framerate. This is configured in the encoder.
        videoHeight:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: Video-resolution height in pixels.
        videoWidth:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: Video-resolution width in pixels.
      description: Object specifying a stream’s video configuration, as set up by the broadcaster (usually in an encoder). This is part of the <a>IngestConfiguration</a> object and used for monitoring stream health.
    RecordingConfigurationName:
      type: string
      pattern: ^[a-zA-Z0-9-_]*$
      minLength: 0
      maxLength: 128
    InsecureIngest:
      type: boolean
    ResourceNotFoundException: {}
    AccessDeniedException: {}
    Integer:
      type: integer
    StreamSession:
      type: object
      properties:
        channel:
          allOf:
          - $ref: '#/components/schemas/Channel'
          - description: The properties of the channel at the time of going live.
        endTime:
          allOf:
          - $ref: '#/components/schemas/Time'
          - description: Time when the channel went offline. This is an ISO 8601 timestamp; <i>note that this is returned as a string</i>. For live streams, this is <code>NULL</code>.
        ingestConfiguration:
          allOf:
          - $ref: '#/components/schemas/IngestConfiguration'
          - description: The properties of the incoming RTMP stream for the stream.
        recordingConfiguration:
          allOf:
          - $ref: '#/components/schemas/RecordingConfiguration'
          - description: The properties of recording the live stream.
        startTime:
          allOf:
          - $ref: '#/components/schemas/Time'
          - description: Time when the channel went live. This is an ISO 8601 timestamp; <i>note that this is returned as a string</i>.
        streamId:
          allOf:
          - $ref: '#/components/schemas/StreamId'
          - description: Unique identifier for a live or previously live stream in the specified channel.
        truncatedEvents:
          allOf:
          - $ref: '#/components/schemas/StreamEvents'
          - description: List of Amazon IVS events that the stream encountered. The list is sorted by most recent events and contains up to 500 events. For Amazon IVS events, see <a href="https://docs.aws.amazon.com/ivs/latest/userguide/eventbridge.html">Using Amazon EventBridge with Amazon IVS</a>.
      description: Object that captures the Amazon IVS configuration that the customer provisioned, the ingest configurations that the broadcaster used, and the most recent Amazon IVS stream events it encountered.
    RecordingReconnectWindowSeconds:
      type: integer
      minimum: 0
      maximum: 300
    IsAuthorized:
      type: boolean
    ThumbnailConfigurationStorage:
      type: string
      enum:
      - SEQUENTIAL
      - LATEST
    TranscodePreset:
      type: string
      enum:
      - HIGHER_BANDWIDTH_DELIVERY
      - CONSTRAINED_BANDWIDTH_DELIVERY
    TargetIntervalSeconds:
      type: integer
      minimum: 1
      maximum: 60
    ValidationException: {}
    ThumbnailConfigurationResolution:
      type: string
      enum:
      - FULL_HD
      - HD
      - SD
      - LOWEST_RESOLUTION
    ChannelArn:
      type: string
      pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:channel/[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    ChannelName:
      type: string
      pattern: ^[a-zA-Z0-9-_]*$
      minLength: 0
      maxLength: 128
    RenditionConfigurationRendition:
      type: string
      enum:
      - FULL_HD
      - HD
      - SD
      - LOWEST_RESOLUTION
    RenditionConfiguration:
      type: object
      properties:
        renditionSelection:
          allOf:
          - $ref: '#/components/schemas/RenditionConfigurationRenditionSelection'
          - description: 'Indicates which set of renditions are recorded for a stream. For <code>BASIC</code> channels, the <code>CUSTOM</code> value has no effect. If <code>CUSTOM</code> is specified, a set of renditions must be specified in the <code>renditions</code> field. Default: <code>ALL</code>.'
        renditions:
          allOf:
          - $ref: '#/components/schemas/RenditionConfigurationRenditionList'
          - description: Indicates which renditions are recorded for a stream, if <code>renditionSelection</code> is <code>CUSTOM</code>; otherwise, this field is irrelevant. The selected renditions are recorded if they are available during the stream. If a selected rendition is unavailable, the best available rendition is recorded. For details on the resolution dimensions of each rendition, see <a href="https://docs.aws.amazon.com/ivs/latest/userguide/record-to-s3.html">Auto-Record to Amazon S3</a>.
      description: Object that describes which renditions should be recorded for a stream.
    StreamEvents:
      type: array
      items:
        $ref: '#/components/schemas/StreamEvent'
      minItems: 0
      maxItems: 500
    ChannelLatencyMode:
      type: string
      enum:
      - NORMAL
      - LOW
    RecordingConfiguration:
      type: object
      required:
      - arn
      - destinationConfiguration
      - state
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/RecordingConfigurationArn'
          - description: Recording-configuration ARN.
        destinationConfiguration:
          allOf:
          - $ref: '#/components/schemas/DestinationConfiguration'
          - description: A complex type that contains information about where recorded video will be stored.
        name:
          allOf:
          - $ref: '#/components/schemas/RecordingConfigurationName'
          - description: Recording-configuration name. The value does not need to be unique.
        recordingReconnectWindowSeconds:
          allOf:
          - $ref: '#/components/schemas/RecordingReconnectWindowSeconds'
          - description: 'If a broadcast disconnects and then reconnects within the specified interval, the multiple streams will be considered a single broadcast and merged together. Default: 0.'
        renditionConfiguration:
          allOf:
          - $ref: '#/components/schemas/RenditionConfiguration'
          - description: Object that describes which renditions should be recorded for a stream.
        state:
          allOf:
          - $ref: '#/components/schemas/RecordingConfigurationState'
          - description: Indicates the current state of the recording configuration. When the state is <code>ACTIVE</code>, the configuration is ready for recording a channel stream.
        tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: Tags attached to the resource. Array of 1-50 maps, each of the form <code>string:string (key:value)</code>. See <a href="https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html">Tagging Amazon Web Services Resources</a> for more information, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no service-specific constraints beyond what is documented there.
        thumbnailConfiguration:
          allOf:
          - $ref: '#/components/schemas/ThumbnailConfiguration'
          - description: A complex type that allows you to enable/disable the recording of thumbnails for a live session and modify the interval at which thumbnails are generated for the live session.
      description: An object representing a configuration to record a channel stream.
    StreamEvent:
      type: object
      properties:
        eventTime:
          allOf:
          - $ref: '#/components/schemas/Time'
          - description: Time when the event occurred. This is an ISO 8601 timestamp; <i>note that this is returned as a string</i>.
        name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Name that identifies the stream event within a <code>type</code>.
        type:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Logical group for certain events.
      description: Object specifying a stream’s events. For a list of events, see <a href="https://docs.aws.amazon.com/ivs/latest/userguide/eventbridge.html">Using Amazon EventBridge with Amazon IVS</a>.
    ThumbnailConfiguration:
      type: object
      properties:
        recordingMode:
          allOf:
          - $ref: '#/components/schemas/RecordingMode'
          - description: 'Thumbnail recording mode. Default: <code>INTERVAL</code>.'
        resolution:
          allOf:
          - $ref: '#/components/schemas/ThumbnailConfigurationResolution'
          - description: 'Indicates the desired resolution of recorded thumbnails. Thumbnails are recorded at the selected resolution if the corresponding rendition is available during the stream; otherwise, they are recorded at source resolution. For more information about resolution values and their corresponding height and width dimensions, see <a href="https://docs.aws.amazon.com/ivs/latest/userguide/record-to-s3.html">Auto-Record to Amazon S3</a>. Default: Null (source resolution is returned).'
        storage:
          allOf:
          - $ref: '#/components/schemas/ThumbnailConfigurationStorageList'
          - description: 'Indicates the format in which thumbnails are recorded. <code>SEQUENTIAL</code> records all generated thumbnails in a serial manner, to the media/thumbnails directory. <code>LATEST</code> saves the latest thumbnail in media/latest_thumbnail/thumb.jpg and overwrites it at the interval specified by <code>targetIntervalSeconds</code>. You can enable both <code>SEQUENTIAL</code> and <code>LATEST</code>. Default: <code>SEQUENTIAL</code>.'
        targetIntervalSeconds:
          allOf:
          - $ref: '#/components/schemas/TargetIntervalSeconds'
          - description: '<p>The targeted thumbnail-generation interval in seconds. This is configurable (and required) only if <code>recordingMode</code> is <code>INTERVAL</code>. Default: 60.</p> <p> <b>Important:</b> For the <code>BASIC</code> channel type, setting a value for <code>targetIntervalSeconds</code> does not guarantee that thumbnails are generated at the specified interval. For thumbnails to be generated at the <code>targetIntervalSeconds</code> interval, the <code>IDR/Keyframe</code> value for the input video must be less than the <code>targetIntervalSeconds</code> value. See <a href="https://docs.aws.amazon.com/ivs/latest/userguide/streaming-config.html"> Amazon IVS Streaming Configuration</a> for information on setting <code>IDR/Keyframe</code> to the recommended value in video-encoder settings.</p>'
      description: An object representing a configuration of thumbnails for recorded video.
    Time:
      type: string
      format: date-time
    AudioConfiguration:
      type: object
      properties:
        channels:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: Number of audio channels.
        codec:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Codec used for the audio encoding.
        sampleRate:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: Number of audio samples recorded per second.
        targetBitrate:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The expected ingest bitrate (bits per second). This is configured in the encoder.
      description: Object specifying a stream’s audio configuration, as set up by the broadcaster (usually in an encoder). This is part of the <a>IngestConfiguration</a> object and used for monitoring stream health.
    DestinationConfiguration:
      type: object
      properties:
        s3:
          allOf:
          - $ref: '#/components/schemas/S3DestinationConfiguration'
          - description: An S3 destination configuration where recorded videos will be stored.
      description: A complex type that describes a location where recorded videos will be stored. Each member represents a type of destination configuration. For recording, you define one and only one type of destination configuration.
    StreamId:
      type: string
      pattern: ^st-[a-zA-Z0-9]+$
      minLength: 26
      maxLength: 26
    ChannelType:
      type: string
      enum:
      - BASIC
      - STANDARD
      - ADVANCED_SD
      - ADVANCED_HD
    S3DestinationBucketName:
      type: string
      pattern: ^[a-z0-9-.]+$
      minLength: 3
      maxLength: 63
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    RenditionConfigurationRenditionSelection:
      type: string
      enum:
      - ALL
      - NONE
      - CUSTOM
    ThumbnailConfigurationStorageList:
      type: array
      items:
        $ref: '#/components/schemas/ThumbnailConfigurationStorage'
    String:
      type: string
    IngestEndpoint:
      type: string
    Channel:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/ChannelArn'
          - description: Channel ARN.
        authorized:
          allOf:
          - $ref: '#/components/schemas/IsAuthorized'
          - description: 'Whether the channel is private (enabled for playback authorization). Default: <code>false</code>.'
        ingestEndpoint:
          allOf:
          - $ref: '#/components/schemas/IngestEndpoint'
          - description: Channel ingest endpoint, part of the definition of an ingest server, used when you set up streaming software.
        insecureIngest:
          allOf:
          - $ref: '#/components/schemas/InsecureIngest'
          - description: 'Whether the channel allows insecure RTMP ingest. Default: <code>false</code>.'
        latencyMode:
          allOf:
          - $ref: '#/components/schemas/ChannelLatencyMode'
          - description: 'Channel latency mode. Use <code>NORMAL</code> to broadcast and deliver live video up to Full HD. Use <code>LOW</code> for near-real-time interaction with viewers. Default: <code>LOW</code>. (Note: In the Amazon IVS console, <code>LOW</code> and <code>NORMAL</code> correspond to Ultra-low and Standard, respectively.)'
        name:
          allOf:
          - $ref: '#/components/schemas/ChannelName'
          - description: Channel name.
        playbackUrl:
          allOf:
          - $ref: '#/components/schemas/PlaybackURL'
          - description: Channel playback URL.
        preset:
          allOf:
          - $ref: '#/components/schemas/TranscodePreset'
          - description: Optional transcode preset for the channel. This is selectable only for <code>ADVANCED_HD</code> and <code>ADVANCED_SD</code> channel types. For those channel types, the default <code>preset</code> is <code>HIGHER_BANDWIDTH_DELIVERY</code>. For other channel types (<code>BASIC</code> and <code>STANDARD</code>), <code>preset</code> is the empty string (<code>""</code>).
        recordingConfigurationArn:
          allOf:
          - $ref: '#/components/schemas/ChannelRecordingConfigurationArn'
          - description: 'Recording-configuration ARN. A value other than an empty string indicates that recording is enabled. Default: "" (empty string, recording is disabled).'
        tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: Tags attached to the resource. Array of 1-50 maps, each of the form <code>string:string (key:value)</code>. See <a href="https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html">Tagging Amazon Web Services Resources</a> for more information, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no service-specific constraints beyond what is documented there.
        type:
          allOf:
          - $ref: '#/components/schemas/ChannelType'
          - description: '<p>Channel type, which determines the allowable resolution and bitrate. <i>If you exceed the allowable input resolution or bitrate, the stream probably will disconnect immediately.</i> Some types generate multiple qualities (renditions) from the original input; this automatically gives viewers the best experience for their devices and network conditions. Some types provide transcoded video; transcoding allows higher playback quality across a range of download speeds. Default: <code>STANDARD</code>. Valid values:</p> <ul> <li> <p> <code>BASIC</code>: Video is transmuxed: Amazon IVS delivers the original input quality to viewers. The viewer’s video-quality choice is limited to the original input. Input resolution can be up to 1080p and bitrate can be up to 1.5 Mbps for 480p and up to 3.5 Mbps for resolutions between 480p and 1080p. Original audio is passed through.</p> </li> <li> <p> <code>STANDARD</code>: Video is transcoded: multiple qualities are generated from the original input, to automatically give viewers the best experience for their devices and network conditions. Transcoding allows higher playback quality across a range of download speeds. Resolution can be up to 1080p and bitrate can be up to 8.5 Mbps. Audio is transcoded only for renditions 360p and below; above that, audio is passed through. This is the default when you create a channel.</p> </li> <li> <p> <code>ADVANCED_SD</code>: Video is transcoded; multiple qualities are generated from the original input, to automatically give viewers the best experience for their devices and network conditions. Input resolution can be up to 1080p and bitrate can be up to 8.5 Mbps; output is capped at SD quality (480p). You can select an optional transcode preset (see below). Audio for all renditions is transcoded, and an audio-only rendition is available.</p> </li> <li> <p> <code>ADVANCED_HD</code>: Video is transcoded; multiple qualities are generated from the original input, to automatically give viewers the best experience for their devices and network conditions. Input resolution can be up to 1080p and bitrate can be up to 8.5 Mbps; output is capped at HD quality (720p). You can select an optional transcode preset (see below). Audio for all renditions is transcoded, and an audio-only rendition is available.</p> </li> </ul> <p>Optional <i>transcode presets</i> (available for the <code>ADVANCED</code> types) allow you to trade off available download bandwidth and video quality, to optimize the viewing experience. There are two presets:</p> <ul> <li> <p> <i>Constrained bandwidth delivery</i> uses a lower bitrate for each quality level. Use it if you have low download bandwidth and/or simple video content (e.g., talking heads)</p> </li> <li> <p> <i>Higher bandwidth delivery</i> uses a higher bitrate for each quality level. Use it if you have high download bandwidth and/or complex video content (e.g., flashes and quick scene changes).</p> </li> </ul>'
      description: Object specifying a channel.
    ChannelRecordingConfigurationArn:
      type: string
      pattern: ^$|^arn:aws:ivs:[a-z0-9-]+:[0-9]+:recording-configuration/[a-zA-Z0-9-]+$
      minLength: 0
      maxLength: 128
    IngestConfiguration:
      type: object
      properties:
        audio:
          allOf:
          - $ref: '#/components/schemas/AudioConfiguration'
          - description: Encoder settings for audio.
        video:
          allOf:
          - $ref: '#/components/schemas/VideoConfiguration'
          - description: Encoder settings for video.
      description: Object specifying the ingest configuration set up by the broadcaster, usually in an encoder.
    RecordingConfigurationState:
      type: string
      enum:
      - CREATING
      - CREATE_FAILED
      - ACTIVE
    GetStreamSessionResponse:
      type: object
      properties:
        streamSession:
          allOf:
          - $ref: '#/components/schemas/StreamSession'
          - description: List of stream details.
    RenditionConfigurationRenditionList:
      type: array
      items:
        $ref: '#/components/schemas/RenditionConfigurationRendition'
    Tags:
      type: object
      minProperties: 0
      maxProperties: 50
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
