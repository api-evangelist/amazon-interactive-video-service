security:
- hmac: []
tags:
- name: GetPlaybackKeyPair
paths:
  /GetPlaybackKeyPair:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetPlaybackKeyPair
      description: Gets a specified playback authorization key pair and returns the arn and fingerprint. The privateKey held by the caller can be used to generate viewer authorization tokens, to grant viewers access to private channels. For more information, see Setting Up Private Channels in the Amazon IVS User Guide.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlaybackKeyPairResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - arn
              properties:
                arn:
                  description: ARN of the key pair to be returned.
                  type: string
                  pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:playback-key/[a-zA-Z0-9-]+$
                  minLength: 1
                  maxLength: 128
      summary: Amazon Interactive Video Service Get Playback Key Pair
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - GetPlaybackKeyPair
components:
  schemas:
    GetPlaybackKeyPairResponse:
      type: object
      properties:
        keyPair:
          allOf:
          - $ref: '#/components/schemas/PlaybackKeyPair'
          - description: <zonbook></zonbook><xhtml></xhtml>
    PlaybackKeyPair:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/PlaybackKeyPairArn'
          - description: Key-pair ARN.
        fingerprint:
          allOf:
          - $ref: '#/components/schemas/PlaybackKeyPairFingerprint'
          - description: Key-pair identifier.
        name:
          allOf:
          - $ref: '#/components/schemas/PlaybackKeyPairName'
          - description: Playback-key-pair name. The value does not need to be unique.
        tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: Tags attached to the resource. Array of 1-50 maps, each of the form <code>string:string (key:value)</code>. See <a href="https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html">Tagging Amazon Web Services Resources</a> for more information, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no service-specific constraints beyond what is documented there.
      description: A key pair used to sign and validate a playback authorization token.
    PlaybackKeyPairArn:
      type: string
      pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:playback-key/[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    PlaybackKeyPairName:
      type: string
      pattern: ^[a-zA-Z0-9-_]*$
      minLength: 0
      maxLength: 128
    PlaybackKeyPairFingerprint:
      type: string
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    ResourceNotFoundException: {}
    ValidationException: {}
    AccessDeniedException: {}
    Tags:
      type: object
      minProperties: 0
      maxProperties: 50
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
