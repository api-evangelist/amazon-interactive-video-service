security:
- hmac: []
tags:
- name: ListStreamSessions
paths:
  /ListStreamSessions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListStreamSessions
      description: Gets a summary of current and previous streams for a specified channel in your account, in the AWS region where the API request is processed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStreamSessionsResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      parameters:
      - name: maxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: nextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - channelArn
              properties:
                channelArn:
                  description: Channel ARN used to filter the list.
                  type: string
                  pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:channel/[a-zA-Z0-9-]+$
                  minLength: 1
                  maxLength: 128
                maxResults:
                  description: 'Maximum number of streams to return. Default: 100.'
                  type: integer
                  minimum: 1
                  maximum: 100
                nextToken:
                  description: The first stream to retrieve. This is used for pagination; see the <code>nextToken</code> response field.
                  type: string
                  pattern: ^[a-zA-Z0-9+/=_-]*$
                  minLength: 0
                  maxLength: 1024
      summary: Amazon Interactive Video Service List Stream Sessions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - ListStreamSessions
components:
  schemas:
    ListStreamSessionsResponse:
      type: object
      required:
      - streamSessions
      properties:
        nextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: If there are more streams than <code>maxResults</code>, use <code>nextToken</code> in the request to get the next set.
        streamSessions:
          allOf:
          - $ref: '#/components/schemas/StreamSessionList'
          - description: List of stream sessions.
    StreamSessionList:
      type: array
      items:
        $ref: '#/components/schemas/StreamSessionSummary'
    PaginationToken:
      type: string
      pattern: ^[a-zA-Z0-9+/=_-]*$
      minLength: 0
      maxLength: 1024
    Boolean:
      type: boolean
    StreamSessionSummary:
      type: object
      properties:
        endTime:
          allOf:
          - $ref: '#/components/schemas/Time'
          - description: Time when the channel went offline. This is an ISO 8601 timestamp; <i>note that this is returned as a string</i>. For live streams, this is <code>NULL</code>.
        hasErrorEvent:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: If <code>true</code>, this stream encountered a quota breach or failure.
        startTime:
          allOf:
          - $ref: '#/components/schemas/Time'
          - description: Time when the channel went live. This is an ISO 8601 timestamp; <i>note that this is returned as a string</i>.
        streamId:
          allOf:
          - $ref: '#/components/schemas/StreamId'
          - description: Unique identifier for a live or previously live stream in the specified channel.
      description: Summary information about a stream session.
    ResourceNotFoundException: {}
    ValidationException: {}
    StreamId:
      type: string
      pattern: ^st-[a-zA-Z0-9]+$
      minLength: 26
      maxLength: 26
    AccessDeniedException: {}
    Time:
      type: string
      format: date-time
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
