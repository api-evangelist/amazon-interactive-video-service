security:
- hmac: []
tags:
- name: BatchStartViewerSessionRevocation
paths:
  /BatchStartViewerSessionRevocation:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: BatchStartViewerSessionRevocation
      description: Performs StartViewerSessionRevocation on multiple channel ARN and viewer ID pairs simultaneously.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStartViewerSessionRevocationResponse'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '482':
          description: PendingVerification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVerification'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - viewerSessions
              properties:
                viewerSessions:
                  description: Array of viewer sessions, one per channel-ARN and viewer-ID pair.
                  type: array
                  items:
                    $ref: '#/components/schemas/BatchStartViewerSessionRevocationViewerSession'
                  minItems: 1
                  maxItems: 20
      summary: Amazon Interactive Video Service Batch Start Viewer Session Revocation
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - BatchStartViewerSessionRevocation
components:
  schemas:
    BatchStartViewerSessionRevocationErrors:
      type: array
      items:
        $ref: '#/components/schemas/BatchStartViewerSessionRevocationError'
    errorMessage:
      type: string
    errorCode:
      type: string
    BatchStartViewerSessionRevocationError:
      type: object
      required:
      - channelArn
      - viewerId
      properties:
        channelArn:
          allOf:
          - $ref: '#/components/schemas/ChannelArn'
          - description: Channel ARN.
        code:
          allOf:
          - $ref: '#/components/schemas/errorCode'
          - description: Error code.
        message:
          allOf:
          - $ref: '#/components/schemas/errorMessage'
          - description: Error message, determined by the application.
        viewerId:
          allOf:
          - $ref: '#/components/schemas/ViewerId'
          - description: The ID of the viewer session to revoke.
      description: Error for a request in the batch for BatchStartViewerSessionRevocation. Each error is related to a specific channel-ARN and viewer-ID pair.
    BatchStartViewerSessionRevocationViewerSession:
      type: object
      required:
      - channelArn
      - viewerId
      properties:
        channelArn:
          allOf:
          - $ref: '#/components/schemas/ChannelArn'
          - description: The ARN of the channel associated with the viewer session to revoke.
        viewerId:
          allOf:
          - $ref: '#/components/schemas/ViewerId'
          - description: The ID of the viewer associated with the viewer session to revoke. Do not use this field for personally identifying, confidential, or sensitive information.
        viewerSessionVersionsLessThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/ViewerSessionVersion'
          - description: 'An optional filter on which versions of the viewer session to revoke. All versions less than or equal to the specified version will be revoked. Default: 0.'
      description: A viewer session to revoke in the call to <a>BatchStartViewerSessionRevocation</a>.
    AccessDeniedException: {}
    ThrottlingException: {}
    ViewerId:
      type: string
      minLength: 1
      maxLength: 40
    ValidationException: {}
    ChannelArn:
      type: string
      pattern: ^arn:aws:[is]vs:[a-z0-9-]+:[0-9]+:channel/[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    PendingVerification: {}
    BatchStartViewerSessionRevocationResponse:
      type: object
      properties:
        errors:
          allOf:
          - $ref: '#/components/schemas/BatchStartViewerSessionRevocationErrors'
          - description: Each error object is related to a specific <code>channelArn</code> and <code>viewerId</code> pair in the request.
    ViewerSessionVersion:
      type: integer
      minimum: 0
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
